name: Build Ved Rahasya Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name ved_rahasya --org com.vedrahasya .

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Run tests
        run: flutter test

      # Keep one signing key across CI builds so Android can install updates.
      # This debug key is for sideloaded test APKs only; Play Store needs a private upload key.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ved-rahasya-android-debug-signing-v1

      - name: Build Android APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ved-Rahasya-APK
          path: build/app/outputs/flutter-apk/app-release.apk
