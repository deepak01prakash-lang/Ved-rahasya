name: Build Ved Rahasya Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ved-rahasya-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Generate original Ved Rahasya intro music
        run: |
          mkdir -p assets/audio
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          duration = 5.4
          notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 392.00]
          with wave.open('assets/audio/ved_rahasya_theme.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(int(rate * duration)):
                  t = i / rate
                  slot = min(int(t / 0.675), len(notes) - 1)
                  local = t - slot * 0.675
                  fade = min(1.0, local / 0.08, (0.675 - local) / 0.16, (duration - t) / 0.35)
                  freq = notes[slot]
                  tone = (math.sin(2 * math.pi * freq * t)
                          + 0.22 * math.sin(2 * math.pi * freq * 2 * t)
                          + 0.08 * math.sin(2 * math.pi * freq * 3 * t))
                  sample = int(32767 * 0.16 * max(0.0, fade) * tone / 1.30)
                  frames.extend(struct.pack('<h', sample))
              out.writeframes(frames)
          PY

      - name: Generate Android project
        run: flutter create --platforms=android --project-name ved_rahasya --org com.vedrahasya .

      - name: Set Android minimum SDK for Firebase Authentication
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          updated, count = re.subn(
              r'minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)',
              'minSdk = 23',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find Android minSdk setting in generated Gradle file.')
          path.write_text(updated)
          PY

      - name: Work around upstream Android lint crash in Firebase dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          if 'checkReleaseBuilds = false' not in source:
              marker = 'android {'
              if marker not in source:
                  raise SystemExit('Could not find generated Android configuration block.')
              source = source.replace(
                  marker,
                  marker + '\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }',
                  1,
              )
              path.write_text(source)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Run tests
        run: flutter test

      # Debug signing remains the safe fallback until the private Play upload key is configured.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ved-rahasya-android-debug-signing-v1

      - name: Configure private Android upload signing
        id: release_signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" && -n "$ANDROID_UPLOAD_KEY_ALIAS" && -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/ved-rahasya-upload.jks"
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          marker = '    buildTypes {'
          debug_signing = 'signingConfig = signingConfigs.getByName("debug")'
          if marker not in source or debug_signing not in source:
              raise SystemExit('Unexpected Flutter Gradle template; refusing to guess release-signing edits.')
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/ved-rahasya-upload.jks")
                      storePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
                  }
              }

          '''
          source = source.replace(marker, signing + marker, 1)
          source = source.replace(debug_signing, 'signingConfig = signingConfigs.getByName("release")', 1)
          path.write_text(source)
          PY
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Private upload signing configured; signed AAB and APK will be built.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Upload-key secrets are not configured; creating the debug-signed test APK only.'
          fi

      - name: Build signed Android App Bundle and APK
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Build Android test APK (debug signing fallback)
        if: steps.release_signing.outputs.enabled != 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ved-Rahasya-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
