name: Build Ved Rahasya Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ved-rahasya-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Generate original Ved Rahasya intro music
        run: |
          mkdir -p assets/audio
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          duration = 5.4
          notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 392.00]
          with wave.open('assets/audio/ved_rahasya_theme.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(int(rate * duration)):
                  t = i / rate
                  slot = min(int(t / 0.675), len(notes) - 1)
                  local = t - slot * 0.675
                  fade = min(1.0, local / 0.08, (0.675 - local) / 0.16, (duration - t) / 0.35)
                  freq = notes[slot]
                  tone = (math.sin(2 * math.pi * freq * t)
                          + 0.22 * math.sin(2 * math.pi * freq * 2 * t)
                          + 0.08 * math.sin(2 * math.pi * freq * 3 * t))
                  sample = int(32767 * 0.16 * max(0.0, fade) * tone / 1.30)
                  frames.extend(struct.pack('<h', sample))
              out.writeframes(frames)
          PY

      - name: Generate Android project
        run: flutter create --platforms=android --project-name ved_rahasya --org com.vedrahasya .

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Run tests
        run: flutter test

      # Keep one signing key across CI builds so Android can install updates.
      # This debug key is for sideloaded test APKs only; Play Store needs a private upload key.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ved-rahasya-android-debug-signing-v1

      - name: Build Android APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ved-Rahasya-APK
          path: build/app/outputs/flutter-apk/app-release.apk
