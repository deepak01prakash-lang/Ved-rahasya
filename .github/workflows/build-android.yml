name: Build Ved Rahasya Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ved-rahasya-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Generate original Ved Rahasya intro music
        run: |
          mkdir -p assets/audio
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          duration = 5.4
          notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 392.00]
          with wave.open('assets/audio/ved_rahasya_theme.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(int(rate * duration)):
                  t = i / rate
                  slot = min(int(t / 0.675), len(notes) - 1)
                  local = t - slot * 0.675
                  fade = min(1.0, local / 0.08, (0.675 - local) / 0.16, (duration - t) / 0.35)
                  freq = notes[slot]
                  tone = (math.sin(2 * math.pi * freq * t)
                          + 0.22 * math.sin(2 * math.pi * freq * 2 * t)
                          + 0.08 * math.sin(2 * math.pi * freq * 3 * t))
                  sample = int(32767 * 0.16 * max(0.0, fade) * tone / 1.30)
                  frames.extend(struct.pack('<h', sample))
              out.writeframes(frames)
          PY
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          rate = 22050
          Path('assets/audio').mkdir(parents=True, exist_ok=True)
          def write_tone(name, duration, notes, harmonics=(1.0, 0.25, 0.08), volume=0.12):
              with wave.open(f'assets/audio/{name}.wav', 'wb') as out:
                  out.setnchannels(1); out.setsampwidth(2); out.setframerate(rate)
                  frames = bytearray()
                  for i in range(int(rate * duration)):
                      t = i / rate
                      slot_len = duration / len(notes)
                      slot = min(int(t / slot_len), len(notes)-1)
                      local = t - slot * slot_len
                      fade = min(1.0, local / 0.06, (slot_len-local) / 0.12, (duration-t) / 0.3)
                      freq = notes[slot]
                      tone = sum(h * math.sin(2*math.pi*freq*(j+1)*t) for j,h in enumerate(harmonics))
                      sample = int(32767 * volume * max(0.0, fade) * tone / sum(harmonics))
                      frames.extend(struct.pack('<h', sample))
                  out.writeframes(frames)
          write_tone('temple_bell', 20, [660, 784, 880, 784, 660, 988, 880, 784], (1,.55,.25,.12), .18)
          write_tone('conch_tone', 20, [196, 220, 247, 220, 196], (1,.35,.12), .16)
          write_tone('devotional_tune', 20, [392,440,494,523,494,440,392,330], (1,.25,.08), .14)
          write_tone('meditation_calm', 60, [130.81,164.81,196.00], (1,.22,.06), .09)
          write_tone('meditation_focus', 60, [110.00,146.83,174.61], (1,.18,.05), .08)
          PY

      - name: Generate Android project
        run: flutter create --platforms=android --project-name ved_rahasya --org com.vedrahasya .

      - name: Configure Android ringtone picker bridge
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          main_activity = next(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          source = main_activity.read_text()
          package = re.search(r'^package\s+([\w.]+)', source, re.M).group(1)
          kotlin = """package __PACKAGE__

          import android.content.ContentValues
          import android.content.Intent
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.FlutterInjector
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.vedrahasya/media"
              private var pendingUri: Uri? = null
              private var pendingTitle = "Ved Rahasya"
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          if (call.method != "setRingtoneFromAsset") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                              result.error("UNSUPPORTED_ANDROID", "रिंगटोन सेट करने के लिए Android 10 या नया संस्करण चाहिए। फ़ाइल शेयर करके फोन की Sound Settings से चुनें।", null)
                              return@setMethodCallHandler
                          }
                          val assetPath = call.argument<String>("assetPath")
                          val title = call.argument<String>("title") ?: "Ved Rahasya"
                          if (assetPath.isNullOrBlank()) {
                              result.error("INVALID_ASSET", "ऑडियो फ़ाइल नहीं मिली।", null)
                              return@setMethodCallHandler
                          }
                          try {
                              val assetKey = FlutterInjector.instance().flutterLoader().getLookupKeyForAsset(assetPath)
                              val values = ContentValues().apply {
                                  put(MediaStore.Audio.Media.DISPLAY_NAME, "$title.wav")
                                  put(MediaStore.Audio.Media.TITLE, title)
                                  put(MediaStore.Audio.Media.MIME_TYPE, "audio/wav")
                                  put(MediaStore.Audio.Media.IS_RINGTONE, 1)
                                  put(MediaStore.Audio.Media.IS_NOTIFICATION, 1)
                                  put(MediaStore.Audio.Media.IS_ALARM, 0)
                                  put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_RINGTONES + "/Ved Rahasya")
                              }
                              val uri = contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                                  ?: throw IllegalStateException("फोन में रिंगटोन फ़ाइल सेव नहीं हो पाई।")
                              contentResolver.openOutputStream(uri)?.use { output ->
                                  assets.open(assetKey).use { input -> input.copyTo(output) }
                              } ?: throw IllegalStateException("रिंगटोन फ़ाइल लिखी नहीं जा सकी।")
                              pendingUri = uri
                              pendingTitle = title
                              pendingResult = result
                              if (Settings.System.canWrite(this)) {
                                  openRingtonePicker()
                              } else {
                                  val intent = Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName"))
                                  startActivityForResult(intent, 901)
                              }
                          } catch (error: Exception) {
                              pendingResult = null
                              result.error("RINGTONE_SAVE_FAILED", error.message ?: "रिंगटोन सेव नहीं हो पाई।", null)
                          }
                      }
              }

              private fun openRingtonePicker() {
                  val uri = pendingUri ?: return
                  val intent = Intent(RingtoneManager.ACTION_RINGTONE_PICKER).apply {
                      putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE, RingtoneManager.TYPE_RINGTONE)
                      putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE, "$pendingTitle को रिंगटोन चुनें")
                      putExtra(RingtoneManager.EXTRA_RINGTONE_EXISTING_URI, uri)
                      putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_DEFAULT, true)
                      putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_SILENT, false)
                  }
                  startActivityForResult(intent, 902)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 901) {
                      if (Settings.System.canWrite(this)) {
                          openRingtonePicker()
                      } else {
                          pendingResult?.error("WRITE_SETTINGS_DENIED", "रिंगटोन बदलने की सिस्टम अनुमति नहीं मिली।", null)
                          clearPending()
                      }
                  } else if (requestCode == 902) {
                      val selected = if (Build.VERSION.SDK_INT >= 33) {
                          data?.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI, Uri::class.java)
                      } else {
                          data?.getParcelableExtra<Uri>(RingtoneManager.EXTRA_RINGTONE_PICKED_URI)
                      }
                      if (resultCode == RESULT_OK && selected != null) {
                          try {
                              RingtoneManager.setActualDefaultRingtoneUri(this, RingtoneManager.TYPE_RINGTONE, selected)
                              pendingResult?.success(true)
                          } catch (error: Exception) {
                              pendingResult?.error("RINGTONE_SET_FAILED", error.message ?: "डिफ़ॉल्ट रिंगटोन सेट नहीं हो पाई।", null)
                          }
                      } else {
                          pendingResult?.success(false)
                      }
                      clearPending()
                  }
              }

              private fun clearPending() {
                  pendingUri = null
                  pendingResult = null
                  pendingTitle = "Ved Rahasya"
              }
          }
          """.replace("__PACKAGE__", package)
          main_activity.write_text(kotlin)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'android.permission.WRITE_SETTINGS' not in xml:
              xml = xml.replace('    <application', '    <uses-permission android:name="android.permission.WRITE_SETTINGS" />\n    <application', 1)
          if 'android.intent.action.TTS_SERVICE' not in xml:
              xml = re.sub(r'(<manifest[^>]*>)', r'\1\n    <queries>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>', xml, count=1)
          manifest.write_text(xml)
          PY

      - name: Set Android minimum SDK for Firebase Authentication
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          updated, count = re.subn(
              r'minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)',
              'minSdk = 23',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find Android minSdk setting in generated Gradle file.')
          path.write_text(updated)
          PY

      - name: Work around upstream Android lint crash in Firebase dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          if 'checkReleaseBuilds = false' not in source:
              marker = 'android {'
              if marker not in source:
                  raise SystemExit('Could not find generated Android configuration block.')
              source = source.replace(
                  marker,
                  marker + '\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }',
                  1,
              )
              path.write_text(source)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Run tests
        run: flutter test

      # Debug signing remains the safe fallback until the private Play upload key is configured.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ved-rahasya-android-debug-signing-v1

      - name: Configure private Android upload signing
        id: release_signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" && -n "$ANDROID_UPLOAD_KEY_ALIAS" && -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/ved-rahasya-upload.jks"
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          source = path.read_text()
          marker = '    buildTypes {'
          debug_signing = 'signingConfig = signingConfigs.getByName("debug")'
          if marker not in source or debug_signing not in source:
              raise SystemExit('Unexpected Flutter Gradle template; refusing to guess release-signing edits.')
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/ved-rahasya-upload.jks")
                      storePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
                  }
              }

          '''
          source = source.replace(marker, signing + marker, 1)
          source = source.replace(debug_signing, 'signingConfig = signingConfigs.getByName("release")', 1)
          path.write_text(source)
          PY
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Private upload signing configured; signed AAB and APK will be built.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Upload-key secrets are not configured; creating the debug-signed test APK only.'
          fi

      - name: Build signed Android App Bundle and APK
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Build Android test APK (debug signing fallback)
        if: steps.release_signing.outputs.enabled != 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ved-Rahasya-Android
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
