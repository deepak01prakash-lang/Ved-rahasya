name: ved_rahasya
description: Ved Rahasya - Sanatana Dharma knowledge app starter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  gal: ^2.3.3
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5
  astronomia: ^1.1.1
  geocoding: ^5.0.1
  timezone: ^0.11.2
  timezone_finder: ^1.0.1
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/ved_rahasya_theme.wav
    - assets/audio/temple_bell.wav
    - assets/audio/conch_tone.wav
    - assets/audio/devotional_tune.wav
    - assets/audio/meditation_calm.wav
    - assets/audio/meditation_focus.wav
