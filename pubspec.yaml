name: ved_rahasya
description: Ved Rahasya - Sanatana Dharma knowledge app starter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  astronomia: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/gita_verses.json
    - assets/audio/ved_rahasya_theme.wav
